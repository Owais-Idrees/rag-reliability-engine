[project]
name = "rag-reliability-lab"
version = "0.1.0"
description = "Offline BM25 retrieval, citations and evaluation for RAG systems"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.scripts]
raglab = "raglab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
